<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CYBER CLICKER // 2077</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@500;700&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
  }

  :root {
    --neon-cyan: #00f0ff;
    --neon-pink: #ff00aa;
    --neon-purple: #b026ff;
    --neon-yellow: #f9f002;
    --dark-bg: #05010f;
    --dark-card: #0d0620;
  }

  body {
    font-family: 'Rajdhani', sans-serif;
    background: var(--dark-bg);
    color: #fff;
    min-height: 100vh;
    overflow: hidden;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  /* Анимированный фон с сеткой */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      linear-gradient(rgba(0, 240, 255, 0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0, 240, 255, 0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridMove 20s linear infinite;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(circle at 20% 20%, rgba(176, 38, 255, 0.25), transparent 50%),
                radial-gradient(circle at 80% 80%, rgba(0, 240, 255, 0.2), transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(255, 0, 170, 0.15), transparent 50%);
    z-index: 0;
    pointer-events: none;
  }

  @keyframes gridMove {
    0% { transform: translate(0, 0); }
    100% { transform: translate(40px, 40px); }
  }

  /* Сканирующая линия */
  .scanline {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 4px;
    background: linear-gradient(90deg, transparent, var(--neon-cyan), transparent);
    box-shadow: 0 0 20px var(--neon-cyan);
    animation: scan 4s linear infinite;
    z-index: 5;
    opacity: 0.6;
  }

  @keyframes scan {
    0% { top: -5%; }
    100% { top: 105%; }
  }

  /* Главный контейнер */
  .app {
    position: relative;
    z-index: 10;
    width: 100%;
    max-width: 480px;
    height: 100vh;
    max-height: 900px;
    padding: 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-between;
  }

  /* Заголовок */
  .header {
    text-align: center;
    width: 100%;
    padding-top: 10px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 28px;
    letter-spacing: 4px;
    background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink), var(--neon-purple));
    background-size: 200% auto;
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: shine 3s linear infinite;
    text-transform: uppercase;
  }

  @keyframes shine {
    to { background-position: 200% center; }
  }

  .subtitle {
    font-size: 11px;
    letter-spacing: 6px;
    color: var(--neon-cyan);
    opacity: 0.7;
    margin-top: 4px;
    text-transform: uppercase;
  }

  /* Счётчик */
  .score-container {
    text-align: center;
    margin-top: 15px;
    padding: 15px 30px;
    background: rgba(13, 6, 32, 0.7);
    border: 1px solid rgba(0, 240, 255, 0.4);
    border-radius: 12px;
    box-shadow: 0 0 30px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(0, 240, 255, 0.05);
    position: relative;
    backdrop-filter: blur(5px);
  }

  .score-container::before,
  .score-container::after {
    content: '';
    position: absolute;
    width: 12px;
    height: 12px;
    border: 2px solid var(--neon-pink);
  }
  .score-container::before { top: -2px; left: -2px; border-right: none; border-bottom: none; }
  .score-container::after { bottom: -2px; right: -2px; border-left: none; border-top: none; }

  .score-label {
    font-size: 10px;
    letter-spacing: 4px;
    color: var(--neon-pink);
    text-transform: uppercase;
    margin-bottom: 5px;
    text-shadow: 0 0 10px var(--neon-pink);
  }

  .score-value {
    font-family: 'Orbitron', sans-serif;
    font-size: 42px;
    font-weight: 900;
    color: #fff;
    text-shadow: 0 0 10px var(--neon-cyan), 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-cyan);
    transition: transform 0.1s;
  }

  .score-value.pop {
    transform: scale(1.15);
  }

  /* Центральная кнопка клика */
  .click-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    width: 100%;
  }

  .click-btn {
    width: 220px;
    height: 220px;
    border-radius: 50%;
    border: 3px solid var(--neon-cyan);
    background: radial-gradient(circle at 50% 50%, rgba(0, 240, 255, 0.2), rgba(176, 38, 255, 0.15), transparent 70%);
    box-shadow:
      0 0 40px rgba(0, 240, 255, 0.6),
      0 0 80px rgba(176, 38, 255, 0.4),
      inset 0 0 40px rgba(0, 240, 255, 0.3);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    transition: transform 0.08s;
    animation: pulse 2s ease-in-out infinite;
  }

  .click-btn:active {
    transform: scale(0.92);
  }

  .click-btn::before {
    content: '';
    position: absolute;
    inset: -10px;
    border-radius: 50%;
    border: 2px dashed rgba(255, 0, 170, 0.6);
    animation: rotate 8s linear infinite;
  }

  .click-btn::after {
    content: '';
    position: absolute;
    inset: -25px;
    border-radius: 50%;
    border: 1px solid rgba(0, 240, 255, 0.3);
    animation: rotate 12s linear infinite reverse;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 40px rgba(0, 240, 255, 0.6), 0 0 80px rgba(176, 38, 255, 0.4), inset 0 0 40px rgba(0, 240, 255, 0.3); }
    50% { box-shadow: 0 0 60px rgba(0, 240, 255, 0.9), 0 0 120px rgba(176, 38, 255, 0.6), inset 0 0 60px rgba(0, 240, 255, 0.5); }
  }

  @keyframes rotate {
    to { transform: rotate(360deg); }
  }

  .click-icon {
    font-size: 60px;
    filter: drop-shadow(0 0 15px var(--neon-cyan));
  }

  .click-text {
    font-family: 'Orbitron', sans-serif;
    font-size: 14px;
    font-weight: 700;
    letter-spacing: 3px;
    color: var(--neon-cyan);
    margin-top: 8px;
    text-shadow: 0 0 10px var(--neon-cyan);
  }

  /* Всплывающие числа */
  .float-num {
    position: absolute;
    font-family: 'Orbitron', sans-serif;
    font-weight: 900;
    font-size: 24px;
    color: var(--neon-yellow);
    text-shadow: 0 0 15px var(--neon-yellow);
    pointer-events: none;
    animation: floatUp 0.9s ease-out forwards;
    z-index: 100;
  }

  @keyframes floatUp {
    0% { opacity: 1; transform: translate(-50%, 0) scale(0.5); }
    100% { opacity: 0; transform: translate(-50%, -120px) scale(1.3); }
  }

  /* Нижние кнопки */
  .bottom-buttons {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    width: 100%;
    padding-bottom: 10px;
  }

  .nav-btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    padding: 18px 10px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    text-transform: uppercase;
    position: relative;
    overflow: hidden;
    transition: all 0.3s;
    color: #fff;
  }

  .nav-btn.btn-tasks {
    background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(0, 240, 255, 0.05));
    border: 2px solid var(--neon-cyan);
    box-shadow: 0 0 20px rgba(0, 240, 255, 0.4), inset 0 0 20px rgba(0, 240, 255, 0.1);
    text-shadow: 0 0 10px var(--neon-cyan);
  }

  .nav-btn.btn-withdraw {
    background: linear-gradient(135deg, rgba(255, 0, 170, 0.15), rgba(255, 0, 170, 0.05));
    border: 2px solid var(--neon-pink);
    box-shadow: 0 0 20px rgba(255, 0, 170, 0.4), inset 0 0 20px rgba(255, 0, 170, 0.1);
    text-shadow: 0 0 10px var(--neon-pink);
  }

  .nav-btn:active {
    transform: scale(0.95);
  }

  .nav-btn:hover {
    box-shadow: 0 0 35px currentColor;
  }

  /* Модальные окна */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(5, 1, 15, 0.85);
    backdrop-filter: blur(8px);
    display: none;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    padding: 20px;
  }

  .modal-overlay.active {
    display: flex;
    animation: fadeIn 0.3s;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  .modal {
    background: var(--dark-card);
    border: 2px solid var(--neon-cyan);
    border-radius: 16px;
    padding: 25px;
    width: 100%;
    max-width: 400px;
    max-height: 80vh;
    overflow-y: auto;
    box-shadow: 0 0 50px rgba(0, 240, 255, 0.5), inset 0 0 30px rgba(0, 240, 255, 0.05);
    animation: slideUp 0.3s;
    position: relative;
  }

  @keyframes slideUp {
    from { transform: translateY(30px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }

  .modal-header {
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 3px;
    text-align: center;
    margin-bottom: 20px;
    color: var(--neon-cyan);
    text-shadow: 0 0 15px var(--neon-cyan);
    text-transform: uppercase;
  }

  .modal.close-pink .modal-header {
    color: var(--neon-pink);
    text-shadow: 0 0 15px var(--neon-pink);
  }

  .modal.close-pink {
    border-color: var(--neon-pink);
    box-shadow: 0 0 50px rgba(255, 0, 170, 0.5), inset 0 0 30px rgba(255, 0, 170, 0.05);
  }

  .task-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px;
    margin-bottom: 10px;
    background: rgba(0, 240, 255, 0.05);
    border: 1px solid rgba(0, 240, 255, 0.3);
    border-radius: 8px;
    transition: all 0.2s;
  }

  .task-item:hover {
    background: rgba(0, 240, 255, 0.1);
  }

  .task-info {
    flex: 1;
    padding-right: 10px;
  }

  .task-name {
    font-size: 14px;
    font-weight: 700;
    color: #fff;
    margin-bottom: 3px;
  }

  .task-reward {
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    color: var(--neon-yellow);
    letter-spacing: 1px;
  }

  .task-btn {
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    font-weight: 700;
    padding: 8px 14px;
    border: 1px solid var(--neon-cyan);
    background: rgba(0, 240, 255, 0.1);
    color: var(--neon-cyan);
    border-radius: 6px;
    cursor: pointer;
    letter-spacing: 1px;
    transition: all 0.2s;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .task-btn:hover {
    background: var(--neon-cyan);
    color: var(--dark-bg);
    box-shadow: 0 0 15px var(--neon-cyan);
  }

  .task-btn:disabled {
    border-color: #444;
    background: rgba(68, 68, 68, 0.2);
    color: #666;
    cursor: not-allowed;
    box-shadow: none;
  }

  .task-btn.done {
    border-color: #00ff88;
    color: #00ff88;
    background: rgba(0, 255, 136, 0.1);
  }

  .input-field {
    width: 100%;
    padding: 14px;
    background: rgba(0, 240, 255, 0.05);
    border: 1px solid rgba(255, 0, 170, 0.5);
    border-radius: 8px;
    color: #fff;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    margin-bottom: 15px;
    outline: none;
    transition: all 0.2s;
  }

  .input-field:focus {
    border-color: var(--neon-pink);
    box-shadow: 0 0 15px rgba(255, 0, 170, 0.5);
  }

  .input-field::placeholder {
    color: rgba(255, 255, 255, 0.3);
  }

  .withdraw-btn {
    width: 100%;
    padding: 15px;
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;
    background: linear-gradient(135deg, var(--neon-pink), var(--neon-purple));
    border: none;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.3s;
    box-shadow: 0 0 25px rgba(255, 0, 170, 0.6);
  }

  .withdraw-btn:hover {
    box-shadow: 0 0 40px rgba(255, 0, 170, 0.9);
    transform: translateY(-2px);
  }

  .withdraw-btn:active {
    transform: translateY(0);
  }

  .withdraw-info {
    text-align: center;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.5);
    letter-spacing: 1px;
    margin-bottom: 15px;
  }

  .withdraw-min {
    font-family: 'Orbitron', sans-serif;
    color: var(--neon-yellow);
    font-weight: 700;
  }

  .close-btn {
    width: 100%;
    margin-top: 15px;
    padding: 12px;
    font-family: 'Orbitron', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    background: transparent;
    border: 1px solid rgba(255, 255, 255, 0.2);
    color: rgba(255, 255, 255, 0.6);
    border-radius: 8px;
    cursor: pointer;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  .close-btn:hover {
    border-color: #fff;
    color: #fff;
  }

  /* Уведомление */
  .toast {
    position: fixed;
    top: 20px;
    left: 50%;
    transform: translateX(-50%) translateY(-100px);
    background: var(--dark-card);
    border: 2px solid var(--neon-cyan);
    padding: 14px 24px;
    border-radius: 10px;
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    letter-spacing: 1px;
    color: var(--neon-cyan);
    box-shadow: 0 0 30px var(--neon-cyan);
    z-index: 2000;
    transition: transform 0.4s;
    text-transform: uppercase;
  }

  .toast.show {
    transform: translateX(-50%) translateY(0);
  }

  /* Скроллбар */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: rgba(0,0,0,0.3); }
  ::-webkit-scrollbar-thumb { background: var(--neon-cyan); border-radius: 3px; }
</style>
</head>
<body>

<div class="scanline"></div>

<div class="app">
  <div class="header">
    <div class="logo">Cyber Clicker</div>
    <div class="subtitle">// Neural Interface v2.077</div>
    <div class="score-container">
      <div class="score-label">Баланс кредитов</div>
      <div class="score-value" id="score">0</div>
    </div>
  </div>

  <div class="click-area">
    <button class="click-btn" id="clickBtn">
      <div class="click-icon">⚡</div>
      <div class="click-text">CLICK</div>
    </button>
  </div>

  <div class="bottom-buttons">
    <button class="nav-btn btn-tasks" onclick="openModal('tasksModal')">
      📋 Задания
    </button>
    <button class="nav-btn btn-withdraw" onclick="openModal('withdrawModal')">
      💰 Вывод
    </button>
  </div>
</div>

<!-- Модалка Задания -->
<div class="modal-overlay" id="tasksModal">
  <div class="modal">
    <div class="modal-header">// Задания</div>
    <div id="tasksList"></div>
    <button class="close-btn" onclick="closeModal('tasksModal')">Закрыть</button>
  </div>
</div>

<!-- Модалка Вывод -->
<div class="modal-overlay close-pink" id="withdrawModal">
  <div class="modal close-pink">
    <div class="modal-header">// Вывод</div>
    <div class="withdraw-info">
      Минимум для вывода: <span class="withdraw-min">10 000</span> кредитов
    </div>
    <input type="text" class="input-field" id="walletInput" placeholder="Введите номер кошелька">
    <input type="number" class="input-field" id="amountInput" placeholder="Сумма вывода">
    <button class="withdraw-btn" onclick="withdraw()">Запросить вывод</button>
    <button class="close-btn" onclick="closeModal('withdrawModal')">Закрыть</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ============ СОСТОЯНИЕ ============
  let state = {
    score: parseInt(localStorage.getItem('cyber_score')) || 0,
    clicks: parseInt(localStorage.getItem('cyber_clicks')) || 0,
    tasks: JSON.parse(localStorage.getItem('cyber_tasks')) || {}
  };

  const scoreEl = document.getElementById('score');
  const clickBtn = document.getElementById('clickBtn');
  const clickArea = document.querySelector('.click-area');

  // ============ СПИСОК ЗАДАНИЙ ============
  const TASKS = [
    { id: 'clicks100', name: 'Сделать 100 кликов', reward: 500, check: () => state.clicks >= 100 },
    { id: 'clicks500', name: 'Сделать 500 кликов', reward: 2500, check: () => state.clicks >= 500 },
    { id: 'clicks1000', name: 'Сделать 1000 кликов', reward: 6000, check: () => state.clicks >= 1000 },
    { id: 'balance5k', name: 'Накопить 5 000 кредитов', reward: 1000, check: () => state.score >= 5000 },
    { id: 'balance10k', name: 'Накопить 10 000 кредитов', reward: 3000, check: () => state.score >= 10000 },
  ];

  // ============ СОХРАНЕНИЕ ============
  function save() {
    localStorage.setItem('cyber_score', state.score);
    localStorage.setItem('cyber_clicks', state.clicks);
    localStorage.setItem('cyber_tasks', JSON.stringify(state.tasks));
  }

  // ============ ОБНОВЛЕНИЕ UI ============
  function updateScore(pop = false) {
    scoreEl.textContent = state.score.toLocaleString('ru-RU');
    if (pop) {
      scoreEl.classList.add('pop');
      setTimeout(() => scoreEl.classList.remove('pop'), 100);
    }
  }

  // ============ КЛИК ============
  clickBtn.addEventListener('click', (e) => {
    state.score += 1;
    state.clicks += 1;
    updateScore(true);
    save();
    spawnFloat(e.clientX, e.clientY, '+1');
    vibrate(15);
  });

  function spawnFloat(x, y, text) {
    const rect = clickArea.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'float-num';
    el.textContent = text;
    el.style.left = (x - rect.left) + 'px';
    el.style.top = (y - rect.top) + 'px';
    clickArea.appendChild(el);
    setTimeout(() => el.remove(), 900);
  }

  function vibrate(ms) {
    if (navigator.vibrate) navigator.vibrate(ms);
  }

  // ============ МОДАЛЬНЫЕ ОКНА ============
  function openModal(id) {
    document.getElementById(id).classList.add('active');
    if (id === 'tasksModal') renderTasks();
  }

  function closeModal(id) {
    document.getElementById(id).classList.remove('active');
  }

  // Закрытие по клику на фон
  document.querySelectorAll('.modal-overlay').forEach(overlay => {
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('active');
    });
  });

  // ============ РЕНДЕР ЗАДАНИЙ ============
  function renderTasks() {
    const list = document.getElementById('tasksList');
    list.innerHTML = '';

    TASKS.forEach(task => {
      const done = state.tasks[task.id];
      const canClaim = !done && task.check();

      const item = document.createElement('div');
      item.className = 'task-item';
      item.innerHTML = `
        <div class="task-info">
          <div class="task-name">${task.name}</div>
          <div class="task-reward">+${task.reward.toLocaleString('ru-RU')} кредитов</div>
        </div>
        <button class="task-btn ${done ? 'done' : ''}"
                ${done ? 'disabled' : ''}
                ${!canClaim && !done ? 'disabled' : ''}
                data-id="${task.id}">
          ${done ? '✓ Готово' : 'Забрать'}
        </button>
      `;
      list.appendChild(item);
    });

    // Обработчики
    list.querySelectorAll('.task-btn').forEach(btn => {
      btn.addEventListener('click', () => claimTask(btn.dataset.id));
    });
  }

  function claimTask(id) {
    const task = TASKS.find(t => t.id === id);
    if (!task || state.tasks[id] || !task.check()) return;

    state.tasks[id] = true;
    state.score += task.reward;
    save();
    updateScore(true);
    showToast(`+${task.reward} кредитов!`);
    renderTasks();
    vibrate([30, 50, 30]);
  }

  // ============ ВЫВОД ============
  function withdraw() {
    const wallet = document.getElementById('walletInput').value.trim();
    const amount = parseInt(document.getElementById('amountInput').value) || 0;

    if (!wallet || wallet.length < 5) {
      showToast('❌ Введите корректный кошелёк');
      return;
    }
    if (amount < 10000) {
      showToast('❌ Минимум 10 000 кредитов');
      return;
    }
    if (amount > state.score) {
      showToast('❌ Недостаточно средств');
      return;
    }

    state.score -= amount;
    save();
    updateScore(true);
    document.getElementById('walletInput').value = '';
    document.getElementById('amountInput').value = '';
    closeModal('withdrawModal');
    showToast(`✅ Заявка на ${amount.toLocaleString('ru-RU')} создана`);
    vibrate([50, 30, 50]);
  }

  // ============ ТОСТ ============
  let toastTimer;
  function showToast(text) {
    const toast = document.getElementById('toast');
    toast.textContent = text;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2500);
  }

  // ============ ИНИЦИАЛИЗАЦИЯ ============
  updateScore();
</script>
